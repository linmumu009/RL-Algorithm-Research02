hypothesis_id: H-039
name: Channel-Set Advantage Sign Certificate
target_problem: Q-001
mechanism_family: audit_calibrated_sign_identification
observed_failure: a point-corrected clean gradient can look accurate on average while individual completion advantages still have audit-compatible sign flips, so mixed harmful sample updates can cancel in aggregate diagnostics and later become policy-amplified
causal_claim: converting each completion's audit-compatible verifier-channel set into a clean-advantage interval and updating only when that entire interval excludes zero prevents harmful sign-flipped sample updates while retaining strongly identified completion-level signal
changed_mathematical_quantity: "point advantage A_hat_i -> identified interval I_i=[min_eta A_i(eta), max_eta A_i(eta)] over audit-compatible FP/FN channels; certified contribution is 1[0 notin I_i] sign(I_i) min_abs(I_i) score_i"
mechanism: estimate frozen contextual FP/FN confidence sets from clean audits, map every observed-reward group advantage through every compatible channel corner, certify a positive or negative sign only when all corners agree, and weight the policy contribution by the worst-case absolute advantage margin
difference_from_existing_methods: H-001 uses one channel point estimate, H-027 chooses one global maximin direction from a gradient set, H-010 masks uncertain samples without identifying clean sign, and SignCert-PO certifies against reward-model parameter perturbations without audit-calibrated verifier-channel uncertainty; H-039 instead identifies per-completion clean-advantage signs from channel intervals before aggregation
falsifiable_predictions: [valid_channel_coverage_limits_false_certified_signs, lower_harmful_sample_update_rate_than_point_correction, mixed_sign_cells_improve_global_clean_gradient, point_identified_limit_matches_H001, matched_acceptance_filter_does_not_explain_gain, channel_misspecification_breaks_certificate]
cheapest_falsification_test: seeded contextual binary verifier channel with mixed positive and negative clean advantages comparing channel-set sign certificates against H001 H027 H010 SignCert-PO scalar pessimism and matched-acceptance filtering
failure_threshold: "false-certified sign rate > 0.05 under valid channel coverage, clean-gradient cosine < 0.90 in strong cells, zero qualifying heterogeneous non-collinear gain cells, behavior equivalent to SignCert-PO or H027, or apparent gain explained by lower acceptance rate"
estimated_budget: 3
score_total: 89
status: REJECTED_NO_INCREMENTAL_GAIN_AND_DOMINATED
repair_count: 0
closest_prior_work: [P-ARXIV-260402986, H-001, H-010, H-027, H-034]
lineage_parent: null
rejection_reason: valid-coverage sign safety and all 72 strong cells passed, but zero of 96 heterogeneous non-collinear cells met the incremental-gain rule; maximum cosine gain over the best non-oracle was 0.000001279 and H-001/H-027 dominated aggregate direction quality
