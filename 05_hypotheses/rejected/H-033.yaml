hypothesis_id: H-033
name: Privacy-Stable Reusable Audit Gradient
target_problem: Q-001
mechanism_family: adaptive_audit_release
observed_failure: a fixed sparse clean-audit set is reused across policy rounds, so each verifier correction query depends on previous audit-derived updates and the policy can adaptively overfit the audit sample even when the original channel estimator is unbiased
causal_claim: clipping each audit-gradient contribution and releasing only a privacy-accounted Gaussian-noised correction limits information leakage from the reusable clean-audit set, preserving population clean-gradient validity across adaptively chosen policy rounds until the privacy filter stops release
changed_mathematical_quantity: "exact repeatedly queried audit correction g_A(theta_t) -> adaptive mechanism M_A(q_t)=clipmean(q_t;A)+N(0,sigma_t^2 I) with composed zCDP budget rho and a release stop when rho is exhausted"
mechanism: keep clean audits hidden, compute a clipped score-weighted verifier-error correction for each committed policy query, add calibrated Gaussian noise, compose privacy loss across rounds, and stop audit-derived correction releases at the frozen privacy budget
difference_from_existing_methods: H-014 chooses which new samples to audit, H-029 releases an anytime-valid scalar gate, H-001 plugs in a channel estimate, and existing private RLHF protects personal records; H-033 instead treats adaptive leakage from repeated clean-audit gradient queries as the failure and spends privacy budget on the correction-release interface
falsifiable_predictions: [bounded_population_bias_under_adaptive_queries, lower_false_positive_direction_than_naive_reuse, more_usable_rounds_than_disjoint_sample_splitting, privacy_off_limit_matches_naive_release, no_advantage_for_nonadaptive_queries, failure_after_privacy_filter_exhaustion]
cheapest_falsification_test: seeded adaptive linear-query attack on a fixed binary clean-audit table comparing private vector release naive reuse fresh audits disjoint splits Reusable Holdout Generic Holdout and a once-trained private reward model
failure_threshold: "population gradient bias > 0.05 or false-positive direction rate > 0.05 before privacy exhaustion, fewer usable rounds than disjoint splitting, no adaptive-query advantage over exact Reusable Holdout, or any claimed gain under nonadaptive queries"
