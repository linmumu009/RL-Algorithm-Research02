experiment_id: E0-H004-DOUBLY-ROBUST
hypothesis_id: H-004
question: Is the proposed clean-gradient estimator unbiased when either the channel model or clean-reward regression is correct?
prediction: Bias remains below 0.05 in both single-correct cells and increases only when both nuisance models are misspecified.
null_result_interpretation: The doubly robust claim is false and H-004 must be rejected before implementation.
dataset: synthetic audited and noisy binary outcomes with known score-function vectors
model: analytic score-function estimator; no language-model training
baseline: [channel_only_correction, outcome_regression_only, naive_combination]
primary_metric: gradient_bias_norm
secondary_metrics: [mse, variance, clean_gradient_cosine]
seed_policy: five fixed seeds [11, 23, 47, 89, 131]
budget_limit: 1
stop_condition: execute the predeclared 2x2 nuisance-correctness table once
success_threshold: bias < 0.05 in each single-correct cell and MSE below both single estimators in at least one sparse-audit regime
failure_threshold: bias >= 0.05 in either single-correct cell
