experiment_id: E0-H021-NEGATIVE-CONTROL-BRIDGE
hypothesis_id: H-021
question: Can a negative-control bridge identify the clean-gradient reward when a latent exploit type drives verifier error and policy score direction?
prediction: The bridge has gradient bias below 0.05 and improves clean-gradient cosine by at least 0.05 over the best observed-stratum projection or pair-average baseline in at least three strong-proxy cells; its condition number worsens as proxy relevance vanishes.
null_result_interpretation: The proxy views do not add clean-gradient identification beyond H-001 or H-005.
negative_result_interpretation: Reject H-021 if the bridge moment is biased under valid proxies or remains apparently stable when completeness is deliberately broken.
dataset: discrete synthetic latent correctness and exploit classes with randomized verifier-only proxy views sparse clean audits and fixed strong-to-weak proxy grids
model: analytic categorical bridge solved by regularized linear moments; no language-model training
baseline: [H001_observed_stratum_correction, H005_declared_nuisance_projection, direct_proxy_regression, direct_pair_average, oracle_latent_exploit_correction]
controls: [no_latent_exploit, revealed_latent_exploit, invalid_exclusion, weak_proxy_rank_collapse, equal_compute_and_audit_count]
metrics: [gradient_bias_norm, clean_gradient_cosine, cosine_gain_over_best_nonoracle, bridge_condition_number, weak_proxy_sensitivity, false_positive_update_rate]
primary_metric: gradient_bias_norm
secondary_metrics: [clean_gradient_cosine, bridge_condition_number, false_positive_update_rate]
fixed_hyperparameters: proxy relevance grid [0.90, 0.80, 0.70, 0.55, 0.52, 0.50]; latent exploit strength grid [0.00, 0.15, 0.30]; ridge values fixed from analytic scale not tuned on outcomes
allowed_tuning: none after code snapshot; numerical ridge may only follow the predeclared condition-number rule
seed_policy: five fixed seeds [11, 23, 47, 89, 131]
budget_limit: 1
stop_condition: stop after the complete proxy relevance by exploit strength grid and all five seeds; do not drop invalid or weak-proxy cells
success_threshold: "bias < 0.05 in every strong valid-proxy cell, cosine gain >= 0.05 in at least three latent-exploit cells, and <= 0.02 difference from the revealed-latent oracle control"
failure_threshold: "bias >= 0.05 in any strong valid-proxy cell, cosine gain <= 0.02 in all latent-exploit cells, or no condition-number degradation in the weak-proxy stress"
